<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 40" role="img" aria-label="KickVista">
  <defs>
    <linearGradient id="sym-bg" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#022C22"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
  </defs>

  <!-- ── Symbol (36×36, centred in 0–40 height) ── -->
  <g transform="translate(2, 2)">
    <circle cx="18" cy="18" r="17" fill="url(#sym-bg)"/>
    <!-- Pentagon -->
    <polygon points="18,10.1 25.5,15.6 22.6,24.4 13.4,24.4 10.5,15.6"
             fill="none" stroke="rgba(255,255,255,0.9)" stroke-width="1.3"/>
    <!-- Radiating lines -->
    <line x1="18"   y1="10.1" x2="18"   y2="1.5"  stroke="rgba(255,255,255,0.35)" stroke-width="0.9"/>
    <line x1="25.5" y1="15.6" x2="33.5" y2="13"   stroke="rgba(255,255,255,0.35)" stroke-width="0.9"/>
    <line x1="22.6" y1="24.4" x2="27.5" y2="32"   stroke="rgba(255,255,255,0.35)" stroke-width="0.9"/>
    <line x1="13.4" y1="24.4" x2="8.5"  y2="32"   stroke="rgba(255,255,255,0.35)" stroke-width="0.9"/>
    <line x1="10.5" y1="15.6" x2="2.5"  y2="13"   stroke="rgba(255,255,255,0.35)" stroke-width="0.9"/>
    <!-- Gold nodes -->
    <circle cx="18"   cy="10.1" r="1.6" fill="#F59E0B"/>
    <circle cx="25.5" cy="15.6" r="1.6" fill="#F59E0B"/>
    <circle cx="22.6" cy="24.4" r="1.6" fill="#F59E0B"/>
    <circle cx="13.4" cy="24.4" r="1.6" fill="#F59E0B"/>
    <circle cx="10.5" cy="15.6" r="1.6" fill="#F59E0B"/>
  </g>

  <!-- ── Wordmark ── -->
  <text
    x="46" y="28"
    font-family="system-ui, -apple-system, 'Helvetica Neue', sans-serif"
    font-size="22"
    font-weight="900"
    letter-spacing="-0.5"
    fill="#022C22"
  >Kick</text>
  <text
    x="97" y="28"
    font-family="system-ui, -apple-system, 'Helvetica Neue', sans-serif"
    font-size="22"
    font-weight="900"
    letter-spacing="-0.5"
    fill="#10B981"
  >Vista</text>
</svg>
